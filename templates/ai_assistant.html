<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Marketing Assistant | LearnMyData</title><meta name="description" content="Ask LearnMyData AI for practical SEO, AEO, GEO, PPC, social media and digital marketing guidance.">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<style>
.ai-wrap{max-width:900px;margin:0 auto;padding:70px 20px}.ai-card{background:#fff;border:1px solid #e5e7eb;border-radius:24px;box-shadow:0 20px 60px rgba(0,0,0,.08);overflow:hidden}.ai-head{padding:34px;background:linear-gradient(135deg,#071b2c,#063d5c);color:#fff}.ai-head h1{margin:8px 0;font-size:clamp(32px,5vw,52px)}.ai-head p{margin:0;opacity:.85}.chat{height:460px;overflow:auto;padding:24px;background:#f7fafc}.msg{max-width:78%;padding:14px 17px;border-radius:18px;margin:12px 0;line-height:1.55;white-space:pre-wrap}.bot{background:#fff;border:1px solid #e5e7eb;margin-right:auto}.user{background:#08a9dc;color:#fff;margin-left:auto}.composer{padding:18px;display:flex;gap:10px;border-top:1px solid #e5e7eb}.composer textarea{flex:1;resize:none;min-height:54px;border:1px solid #d1d5db;border-radius:14px;padding:14px;font:inherit}.composer button{border:0;cursor:pointer}.suggestions{display:flex;flex-wrap:wrap;gap:8px;padding:0 24px 20px;background:#f7fafc}.suggestions button{border:1px solid #cbd5e1;background:#fff;border-radius:999px;padding:9px 13px;cursor:pointer}
</style></head><body>
<nav><div class="wrap nav"><a class="brand" href="{{ url_for('home') }}"><img src="{{ url_for('static', filename='logo.svg') }}" alt="LearnMyData logo"></a><div class="links"><a href="{{ url_for('home') }}">Home</a><a href="{{ url_for('services') }}">Services</a><a href="{{ url_for('home') }}#contact">Contact</a></div></div></nav>
<main class="ai-wrap"><div class="ai-card">
<div class="ai-head"><div class="kicker" style="color:#63d7f5">LEARNMYDATA AI</div><h1>AI Marketing Assistant</h1><p>Practical guidance for SEO, AEO, GEO, PPC, social media, content and growth.</p></div>
<div id="chat" class="chat"><div class="msg bot">Hi! I'm the LearnMyData AI Marketing Assistant. Tell me about your business or ask me a marketing question.</div></div>
<div class="suggestions"><button data-q="How can I get more customers from Google?">Get more Google customers</button><button data-q="Create a 30-day SEO plan for my business.">30-day SEO plan</button><button data-q="How should a small business improve its visibility in AI search?">Improve AI search visibility</button><button data-q="What digital marketing KPIs should I track?">Marketing KPIs</button></div>
<form id="aiForm" class="composer"><textarea id="message" placeholder="Ask your marketing question..." required></textarea><button class="btn primary" type="submit">Ask AI →</button></form>
</div><p style="text-align:center;margin-top:18px"><a href="{{ url_for('home') }}">← Back to LearnMyData</a></p></main>
<script>
const chat=document.getElementById('chat'),form=document.getElementById('aiForm'),input=document.getElementById('message');
function add(text,cls){const el=document.createElement('div');el.className='msg '+cls;el.textContent=text;chat.appendChild(el);chat.scrollTop=chat.scrollHeight}
document.querySelectorAll('.suggestions button').forEach(b=>b.onclick=()=>{input.value=b.dataset.q;input.focus()});
form.onsubmit=async e=>{e.preventDefault();const message=input.value.trim();if(!message)return;add(message,'user');input.value='';const wait=document.createElement('div');wait.className='msg bot';wait.textContent='Thinking…';chat.appendChild(wait);chat.scrollTop=chat.scrollHeight;try{const r=await fetch('/api/ai-assistant',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message})});const d=await r.json();wait.remove();add(d.message||'Sorry, something went wrong.','bot')}catch(err){wait.remove();add('The AI Assistant is temporarily unavailable. Please try again.','bot')}};
</script></body></html>
